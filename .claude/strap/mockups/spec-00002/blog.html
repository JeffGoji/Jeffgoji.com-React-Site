<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NA6 Build Log — Miyoshi — jeffgoji.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<nav class="nav" data-nav></nav>

      <span class="chip">OWNED SINCE <b>2003</b></span>
      <span class="chip">STATUS <b>Daily-able</b></span>
    </div>
  </div></div>
  <div class="hero__flag"></div>
</header>

<main class="section">
  <div class="container">
    <div class="blog" data-blog></div>
  </div>
</main>

<footer class="footer" data-footer></footer>

<script src="assets/mock-data.js"></script>
<script src="assets/app.js"></script>
<script>
  GOJI.renderShell("garage");
  document.querySelector("[data-banner]").src = "assets/img/car-na.jpg";
