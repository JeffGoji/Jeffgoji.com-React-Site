  Author the four `metrics[]` tiles with values, units, delta/trend/gauge, one-line notes, and the `target` flags. Perf tiles start as TARGET placeholders sourced from the Spec's AC perf goals; the Shipped tile is a SHIPPED fact.

  ## Linked Story
  **Story:** 00063
  ## Original Estimate
  **Hours (senior-developer):** 3
  ## Implementation guidance
  Write into `src/components/WhatsNew/data/metrics.js`. Image payload -50%/down/gauge 50, LCP 2.5s/down/gauge 62, Lighthouse 90+/up/gauge 90 — all `target:true`. Shipped 100%/flat/gauge 100, `target:false`, note "every claim below = real work". Values must equal the Spec AC-006/007/008 targets exactly — no rounding up. Author the dashboard caption explaining the TARGET-vs-SHIPPED convention in-voice.
