  ## Implementation guidance
  Mirror mock-data.js. `trend` ∈ {up,down,flat}; `gauge` 0-100; `target` boolean drives the TARGET/SHIPPED badge. This is the SEAM tech-writer fills (Story 00063) — add a comment banner (like Cars.json/*Blog.json) noting tech-writer owns values, frontend owns shape. One shared source file, not two.
