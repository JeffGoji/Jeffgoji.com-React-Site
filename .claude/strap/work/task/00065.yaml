  # Create the whatsNew[] + metrics[] data module with shape contract

  ## Description
  Author `src/components/WhatsNew/data/whatsNew.js` (`{ver,tag,goal,title,body,why,how}[]`) and `metrics.js` (`{value,unit,label,delta,trend,note,gauge,target}[]`) matching the MOCK shapes verbatim, with empty-safe placeholder defaults so the page renders before tech-writer's copy lands.

  ## Linked Story
  **Story:** 00061
  ## Original Estimate
  **Hours (senior-developer):** 3
  ## Implementation guidance
  Mirror mock-data.js. `trend` ∈ {up,down,flat}; `gauge` 0-100; `target` boolean drives the TARGET/SHIPPED badge. This is the SEAM tech-writer fills (Story 00063) — add a comment banner (like Cars.json/*Blog.json) noting tech-writer owns values, frontend owns shape. One shared source file, not two.
