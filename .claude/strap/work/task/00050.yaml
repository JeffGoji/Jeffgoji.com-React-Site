  # Wire SPA route-change pageview + engagement tracking

  ## Description
  Add a small `usePageviews()` hook (`src/hooks/usePageviews.js`) subscribing to React Router `useLocation()`; on each location change fire the analytics pageview API (guarded `if (window.<tool>)`) so client-side navigations across `App.jsx:47-68` register. Externalize the tool global behind one wrapper module (`src/lib/analytics.js`) so SQ-001's choice is a one-line swap. Author the unit test in this task.

  ## Linked Story
  **Story:** 00043
  ## Original Estimate
  **Hours (senior-developer):** 4
  ## Implementation guidance
  No cookies; no-op safely when the global is absent (SSR/test). Hook owns the side-effect; components stay clean.
  ## Dependencies
  Predecessor: 00049 (script present).
  ## Definition of Done
  Navigating between two routes fires exactly one pageview each; unit test asserts trackPageview called once per useLocation change (mock global) + no-op when undefined; zero cookies set. Test authored (dev-lead runs).
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
