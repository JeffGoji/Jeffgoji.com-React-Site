  # Finalize 'The Goji Line' SVG logo as a production asset

  ## Description
  Promote `mockups/spec-00002/assets/logo.svg` to a production asset at `src/assets/logo.svg`: keep the racing-line "G" apex mark + white apex dot + JEFF**GOJI** wordmark (GOJI `#E10600`, JEFF `#F6F6F4` per the deliberate design-memory exception) + "THE GOJI LINE" tagline, retain `role="img"` + `aria-label`. Deliver ready for ST-4 to import in NavMenu/Header.

  ## Linked Story
  **Story:** 00008

  ## Original Estimate
  **Hours (senior-developer):** 3

  ## Implementation guidance
  Consume as inline SVG (self-hosted Archivo applies), per the mockup `app.js` pattern — NOT via `<img src>`. RECOMMEND outlining the `<text>` wordmark to vector paths so the asset is self-contained/pixel-stable even before font-load (small port decision to flag). Do NOT do the NavMenu swap or delete logo.gif here — that's ST-4 (00019).

  ## Dependencies
  Predecessor: 00015 (if kept as `<text>`, depends on self-hosted Archivo).

  ## Definition of Done
  `src/assets/logo.svg` exists, opens crisp at 24-44px height, shows the correct two-tone wordmark + apex dot, carries the a11y label, and renders correctly both inlined and as `<img>` (if outlined).

  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
