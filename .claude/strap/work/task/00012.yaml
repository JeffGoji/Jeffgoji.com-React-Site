  # Port tokens.css :root custom properties into _tokens.scss

  ## Description
  Create `src/scss/_tokens.scss` — a single `:root {}` block reproducing every custom property from `mockups/spec-00002/assets/tokens.css` verbatim: palette (`--goji-red*`, `--ink-1000..400`, `--text-hi/mid/lo`, `--silver`/`--carbon`), semantic `--color-*` aliases, type scale (`--font-*`, `--fs-*`, `--lh-*`, `--tracking-*`), spacing/radii, `--hairline`/`--accent-bar`, shadows/`--glow-red`, layout (`--container-*`, `--nav-h`), motion, `--checker`. Preserve the explanatory comments.

  ## Linked Story
  **Story:** 00007

  ## Original Estimate
  **Hours (senior-developer):** 3

  ## Implementation guidance
  Straight Tier-1 port — no value changes. Keep `--font-*` stacks exactly (they name the self-hosted families from Task 00015). Keep semantic `--color-*` indirection (don't fold into literals) so P5/P3 theme against `--color-surface`/`--color-reading`.

  ## Dependencies
  None.

  ## Definition of Done
  `_tokens.scss` compiles with no Sass errors when imported into a probe stylesheet; token parity vs tokens.css :root (names + values); `--color-bg` resolves to `--ink-900` (#141418), `--color-reading` to `--ink-700` (#202027).

