  # Wire the 4 blog routes onto BlogList

  ## Description
  Replace the `blog/{Miyoshi,Kiryu,Kasumi,Panda}/index.jsx` bodies with `<BlogList>` + per-car banner/title/chips config; repoint the blog JSON `picture` fields to the webp renditions (from Feature C).

  ## Linked Story
  **Story:** 00027
  ## Original Estimate
  **Hours (senior-developer):** 4
  ## Implementation guidance
  Each of the 4 blog components becomes a thin `<BlogList data={...Blog.json} .../>`. Blog `picture` webp repoint depends on Feature C (AC-010) — until then, existing paths render.
  ## Dependencies
  Predecessor: 00034 (BlogList). Blog webp ← Feature C (soft).
  ## Definition of Done
  All 4 blog routes render the V2 build-log through `<BlogList>`; content intact (AC-016); per-source data-integrity (unique numeric id, required fields). Tests authored.
