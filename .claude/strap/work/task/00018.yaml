  # Collapse the three CSS entry paths onto the single token-driven system

  ## Description
  Import `styles.scss` through the React entry (`src/main.jsx`) and delete the separate `/src/scss/js/main.js` `<script>` tag at `index.html:96` (fold its Bootstrap-JS import into the React entry). Migrate the few still-needed rules from `src/assets/css/style.css` into the token SCSS (drop the legacy `background:black`/gray-nav/gray-footer overrides) and remove the `App.jsx:34` `style.css` import. Result: one CSS entry path on the token layer.

  ## Linked Story
  **Story:** 00009

  ## Original Estimate
  **Hours (senior-developer):** 5

  ## Implementation guidance
  Real files: `src/main.jsx` (import SCSS), `index.html:96` (drop script), `src/scss/js/main.js` (fold Bootstrap-JS), `src/assets/css/style.css` (migrate + retire), `App.jsx:34` (remove import). Migrate only rules that a mockup surface still needs; the rest are superseded by the token system.

  ## Dependencies
  Predecessor: 00017 (assembled styles.scss must exist first).

  ## Definition of Done
  One CSS entry path; `style.css` no longer imported; the separate `scss/js/main.js` `<script>` removed from index.html; site renders on the token layer with no visual regression vs the mockups; no leftover legacy black/gray overrides.

  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
