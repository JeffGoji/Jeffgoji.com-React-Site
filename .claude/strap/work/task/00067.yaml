  # Build the telemetry instrument cluster (status strip + stat tiles)

  ## Description
  Port `InstrumentCluster.jsx` verbatim from whats-new.html — the `.tele-strip` telltales (LIVE dot, BUILD/NODE/PIPELINE/ANALYTICS chips) + the `.tele-grid` of `.tele-tile` cards (head label + `.tele-badge--target/--live`, value+unit, `.tele-tile__delta.is-{trend}` arrow, `.tele-tile__meter` fill at gauge%, note), data-driven from `metrics[]`.

  ## Linked Story
  **Story:** 00062
  ## Original Estimate
  **Hours (senior-developer):** 5
  ## Implementation guidance
  `metrics.map(...)` per whats-new.html; badge class from `m.target`; meter inline `width:${gauge}%`; delta class `is-${trend}`. Port `.tele-*` rules from app.css into page SCSS keyed off the Feature A/P5 tokens. Author the RTL unit test in this task.
  ## Dependencies
  Story 00061 data module + Feature A/P5 tokens.
  ## Definition of Done
  One tile per metric with correct badge/delta/meter; matches the mockup; unit test authored (tile count = metrics length; badge = TARGET when target else SHIPPED; meter width = gauge; trend class applied); empty-metrics renders an empty grid without error.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
