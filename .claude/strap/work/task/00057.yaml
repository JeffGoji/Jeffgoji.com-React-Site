  # Build shared ResponsiveImage primitive

  ## Description
  Create one reusable `<ResponsiveImage>` (`src/components/common/ResponsiveImage.jsx`) emitting a webp `<img>` with `srcset` (rendition widths from Story 00044's manifest/naming), a `sizes` prop, `alt`, and `loading` (`"lazy"` default, `"eager"` opt-out for above-fold LCP). Single composition unit so no surface hand-rolls srcset. Author the unit test in the same task.

  ## Linked Story
  **Story:** 00045
  ## Original Estimate
  **Hours (senior-developer):** 4
  ## Implementation guidance
  Props-in/callback-out; consumes devops' documented rendition-width set (align field names during reconcile). Markdown render path unaffected.
  ## Dependencies
  Story 00044's manifest/rendition-naming contract.
  ## Definition of Done
  Component + test authored; test asserts srcset built from widths, `sizes` passthrough, `loading` defaults lazy / honors eager, alt required; matches the manifest field shape.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
