  # Car-identity banner + shared BlogList build-log

  ## Description
  Build `<BlogList>`: car-identity `.hero` banner (img `.media--editorial`, eyebrow, title, status chips), telemetry `.spec-row` chips (DATE/MILEAGE/COST in Space-Mono), `.post` entries, pagination 3/page sort id desc. Entries render via the REAL react-markdown + remark-gfm with the existing custom p/img/a renderers — **markdown-only, no rehype-raw, no dangerouslySetInnerHTML** (the P8 markdown-safety guard).

  ## Linked Story
  **Story:** 00027
  ## Original Estimate
