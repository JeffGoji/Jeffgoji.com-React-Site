  # Wire a download/wallpaper affordance to the full-resolution gallery rendition

  ## Description
  Task 00074 shrank `public/gallery/*/original/` from ~880MB to ~389MB (mozjpeg re-encode, same pixel dimensions), but its own closing report flagged a real gap: **nothing on the site currently exposes these full-resolution images to a visitor**. `GalleryHub.framesFrom` (`src/components/common/GalleryHub.jsx:60-66`) deliberately drops the manifest's `full` field when normalizing items, and `GalleryLightbox` renders only `frame.original` (the 1600w display webp) — its own docblock states `full` "must never reach" the overlay. CPO's stated goal for keeping full resolution at all was download/wallpaper use, so this Task closes that gap: add a real "Download full resolution" affordance to the gallery lightbox, wired to the manifest's `full` field (via a plumbed-through prop, not by re-adding `full` to the normalized frame object wholesale — check whether `GalleryHub`'s doc comment explaining the deliberate omission needs updating to describe the new, intentional exception).

  ## Linked Story
  **Story:** 00045
  ## Original Estimate
  **Hours (senior-developer):** 3
  ## Implementation guidance
  Read `GalleryHub.jsx`'s existing docblock (lines ~55-56, ~89) before touching anything — it explains why `full` was dropped (avoiding accidental full-res `srcset`/preload triggering multi-MB fetches). The fix here is a explicit, single, user-initiated action (a link/button in the lightbox, not eager-loaded, not part of any `srcset`) — e.g. an `<a href={frame.full} download>` styled affordance, so `full` is only ever fetched on deliberate click, preserving the original design intent that lightbox navigation itself never touches it. `GalleryLightbox.jsx` currently renders `frame.original` only (`src/components/common/GalleryLightbox.jsx:33`) — add the download link without changing how the displayed image itself loads.
  ## Dependencies
  Predecessor: Task 00074 (needs the smaller, re-encoded `full` rendition in place — done, merged into `feature/strap-onboarding`).
  ## Definition of Done
  Every gallery lightbox slide exposes a working download link/button pointing at the manifest's `full` field (the re-encoded ~389MB-aggregate rendition); the link is user-initiated only (no eager fetch, no srcset entry); existing lightbox/gallery tests still pass; a new test asserts the affordance is present and points at the correct `full` URL for a sample manifest item.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
