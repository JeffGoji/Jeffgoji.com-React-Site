  # Poster-facade video grid (click-to-load, replacing eager iframes)

  ## Description
  Replace `YouTube/index.jsx` eager iframes with a data-driven `<VideoGrid>`/`<VideoCard>`: a `videos[]` array (real 3 ids + net-new `meta`), poster image + play button, click swaps facade → `youtube.com/embed/<id>` iframe. Serves the Home videos section + the `/youtube` route (adopted delta).

  ## Linked Story
  **Story:** 00026
  ## Original Estimate
  **Hours (senior-developer):** 5
  ## Implementation guidance
  Real ids `UySrXUfHA_k / Q2B8mA3vgP0 / XVjs7LRCBak`. Mockup home.html video grid. No iframe in DOM until click (perf, AC-010 rollup). Do not introduce raw HTML.
