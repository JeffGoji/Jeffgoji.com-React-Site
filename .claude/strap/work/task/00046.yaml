  # Pin Node + fix immutable-cache-on-non-hashed-originals

  ## Description
  Pin Node via `.nvmrc` (`20`, floor 18.17 for `sharp@0.34`) + `netlify.toml [build.environment] NODE_VERSION="20"` so local + Netlify agree. Fix the `public/_headers` defect: `build-gallery.mjs:59-62` copies `original/` with the raw source filename (not content-hashed), so `immutable` serves stale for a year — scope `immutable` to the hashed `display/`+`thumbs/` webp only; give `/gallery/*/original/*` a short/revalidate policy. Keep the `manifest.json` max-age=300 rule.

  ## Linked Story
  **Story:** 00042
  ## Original Estimate
  **Hours (senior-developer):** 5
  ## Implementation guidance
  Do NOT add security headers (nosniff/HSTS/CSP) here — that's security-reviewer (P8). Netlify per-push build IS CI; no GitHub Actions.
  ## Dependencies
  None.
  ## Definition of Done
  `npm run build` succeeds under pinned Node locally (sharp resolves); `_headers` no longer marks non-hashed `original/` immutable; derivatives still cached long. AC-013.
