  # Port the .media--editorial grade layer into _grade.scss

  ## Description
  Create `src/scss/_grade.scss` porting the reusable editorial image-grade system from `app.css:201-242`: the `--grade-*` `:root` vars, base `.media--editorial` (`position:relative; isolation:isolate`), `.media--editorial > img` filter (brightness .95/contrast 1.06/saturate .90), the `.media--editorial::after` multiply-blend tone+vignette overlay, the `--hero`/`--soft` modifiers, and the reduced-motion guard. This is the class P3/ST-4 apply to `.hero__media`/`.card__media`/`.thumb`/`.post__media`.

  ## Linked Story
  **Story:** 00007

  ## Original Estimate
  **Hours (senior-developer):** 3

  ## Implementation guidance
  Verbatim port. CRITICAL: overlay MUST be `::after` (not `::before`) so it survives child stacking (number-tags/index-chips); keep `isolation:isolate` so the multiply blend can't leak past the media box.

  ## Dependencies
  Predecessor: 00012 (grade overlay references `--dur`/`--ease-out` from tokens).

  ## Definition of Done
  `_grade.scss` compiles; a probe `<figure class="media--editorial"><img></figure>` renders the filter + a multiply `::after` overlay; `--hero`/`--soft` override the grade vars; `prefers-reduced-motion` removes the filter transition.

  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
