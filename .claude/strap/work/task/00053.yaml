  # Generalize build-gallery.mjs to all galleries + 0-items guard + export-refactor + helper tests

  ## Description
  Expand the hardcoded `GALLERIES` array (`build-gallery.mjs:33-44`) to every set the site ships (`nd-totd2025`, `nd-hillcountry`, `nc-eastcoast15`, `nc-yellowstone15`, the MSM/`nb-hillcountry` set, `c8-autocross`) with real `srcDir`. Add a "0 items found" guard (renamed dir → fast-glob empty → silently ships `count:0`, no error today). Export the pure helpers `parseDateAlt`/`sortKeys`/`cleanName` for testability. Add Vitest unit tests for those three + `chunk.js buildChunkMap` (folds in the P9 build-helper test line).

  ## Linked Story
  **Story:** 00044
  ## Original Estimate
  **Hours (senior-developer):** 5
  ## Implementation guidance
  Keep the per-file try/catch → `manifest.skipped` (already good). Guard `main()` behind an entry check so helpers import cleanly.
  ## Dependencies
  None within C2a (foundation for 00054/00055/00056).
  ## Definition of Done
  `npm run gallery:build` emits a populated `public/gallery/<slug>/manifest.json` for ALL slugs; a renamed/empty srcDir fails loud (not silent count:0); exported helpers importable; `npm test` green on the new unit tests.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
