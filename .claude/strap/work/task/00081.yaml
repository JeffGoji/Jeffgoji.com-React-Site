  # Add ND gallery "Miatas at the Gap 2026"; fix chassis-submenu overflow in Galleries nav

  ## Request

  CPO asked to begin a new lightweight round of work (not a formal Requirement/Spec):
  add a new ND-chassis photo gallery for "Miatas at the Gap 2026", built through the
  same sharp/mozjpeg compression pipeline as every existing gallery, linked from the
  navbar's Galleries dropdown under the ND Miata submenu. CPO to review live in the
  browser before anything reached `main`.

  ## What shipped

  1. **New gallery, `nd-miatasatthegap2026`** — CPO supplied 31 camera-named JPEGs
     into `src/assets/images/nd/MiatasAtTheGap2026/` (committed, matching this
     project's convention of tracking gallery originals in git). Registered in
     `scripts/build-gallery.mjs`'s `GALLERIES` array and `src/components/common/gallerySets.js`'s
     `GALLERY_SETS`, and linked from the ND submenu in `src/components/NavMenu/index.jsx`.
     `npm run gallery:build` processed all 31 items with 0 skipped; source payload
     115 MB compressed to 52 MB in `public/gallery/nd-miatasatthegap2026/` (gitignored,
     build-generated), in line with this pipeline's usual ~50%+ reduction.
  2. **Bug found and fixed during CPO's own browser review**: the Galleries dropdown's
     four chassis submenus (NB/NC/ND/C8) all opened with `drop="end"` (toward the
     navbar's right edge, where the panel itself already sits with almost no margin
     before the viewport boundary). A long enough label ran off-screen and forced a
     page-wide horizontal scrollbar. This gallery's label ("Miatas at the Gap 2026")
     made it obvious, but it was **not a regression from this task** — NC's existing
     "Yellowstone West Coast Trip 2015" entry reproduced the identical overflow at
     the same viewport width, confirmed via `document.documentElement.scrollWidth >
     clientWidth` before the fix and `==` after. Fixed by flipping all four submenus
     to `drop="start"`, opening them toward the roomy side of the nav instead.
     Verified live in Chrome at ~1707px width (no overflow, both ND and NC submenus
     render fully on-screen) and confirmed mobile is unaffected: Bootstrap's own
     `.navbar-nav .dropdown-menu { position: static }` rule (only overridden to
     `position: absolute` inside the `.navbar-expand-lg` media query) means `drop`
     direction has zero effect below the navbar's 992px collapse breakpoint — CPO
     separately confirmed correct behavior in mobile view.

  ## Verification

  - Full Vitest suite: 1071/1071 passing after both changes (one existing test,
    `src/App.test.jsx`'s `SUBMENU_FOR_SLUG` map, needed the new slug added — a
    data-driven redirect test, not new coverage).
  - Live Chrome verification: nav dropdown → ND submenu → new gallery entry lands on
    `/galleries?set=nd-miatasatthegap2026` with correct title/selector, all 31
    thumbnails render, lightbox opens to full resolution with correct caption and a
    working download-full-resolution link.
  - CPO reviewed both the new gallery and the submenu-overflow fix live in browser
    (desktop and mobile) before approving the push. "This is an excellent fix.
    Approved 100%."

  ## Impact

  New gallery live for visitors browsing ND Miata content. The submenu-overflow fix
  removes a pre-existing (if less visible) layout bug that also affected the NC
  chassis submenu; no visitor-facing regression risk since mobile rendering is
  architecturally untouched by the change.

  ## Quality Checklist

  - [x] Request and scope are stated as given by the CPO.
  - [x] What shipped is broken into concrete, verifiable pieces.
  - [x] The submenu-overflow bug's root cause is traced to a specific prop/CSS rule,
        not just described symptomatically.
  - [x] Confirmed the bug predates this task (NC reproduces identically) rather than
        overstating it as introduced by the new gallery.
  - [x] Verification section separates automated (Vitest) from manual (live Chrome)
        confirmation.
  - [x] CPO's direct approval quote is captured.
