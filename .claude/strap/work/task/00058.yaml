  # Apply ResponsiveImage to blogs + Garage cards

  ## Description
  Swap the header `<Image src={post.picture}>` in all four `blog/*/index.jsx` and the car imgs in `Garage/Cards.jsx` to `<ResponsiveImage>` pointing at webp renditions; repoint blog JSON `picture` (or resolve at render) to built webp; below-fold lazy. Fix the generic `alt="this post's pic"` to descriptive alt while here.

  ## Linked Story
  **Story:** 00045
  ## Original Estimate
  **Hours (senior-developer):** 4
  ## Implementation guidance
  Keep the markdown `<img>` renderer's existing `loading="lazy"` (already present). No full-res original where a rendition suffices. Coordinate with Feature B Story 00027 (which owns the blog/garage components) so the ResponsiveImage swap lands cleanly.
  ## Dependencies
  Predecessor: 00057. Needs Story 00044 renditions + Feature B Story 00027 surfaces.
  ## Definition of Done
  Each surface renders webp srcset; no raw multi-MB JPG import remains on these surfaces; descriptive alt. AC-010.
