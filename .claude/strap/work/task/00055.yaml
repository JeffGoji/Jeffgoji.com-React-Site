  # Retire pattern-a (static Vite-import arrays) + pattern-b (runtime canvas thumbnailing)

  ## Description
  With Task 00053 emitting manifests for every slug, no gallery needs static full-res Vite imports or in-browser canvas thumbnailing. Remove the `images.js` arrays (NC/EastCoast15, NC/Yellowstone15, NB/HillCountry, C8/autocross), remove the `_thumbs/thumbs.js` runtime-canvas hydration from `ND/HillCountry/index.jsx`, and retire deprecated `import.meta.globEager` if present. Point each surface at `fetch('/gallery/<slug>/manifest.json')` (the contract `TailOfTheDragon/index.jsx` already uses). Keep `_thumbs/chunk.js` (still used for set-chunking, unit-tested in 00053).

  ## Linked Story
  **Story:** 00044
  ## Original Estimate
  **Hours (senior-developer):** 4
  ## Implementation guidance
  Resolves the half-consumed `nd-hillcountry` waste. SEAM: the hub route consolidation + set-switcher is Feature B Story 00029 — this task does the build-side consolidation + retires dead artifacts; coordinate landing so components aren't orphaned.
  ## Dependencies
  Predecessor: 00054 (manifests + full schema first). Seams to Feature B Story 00029/00041.
  ## Definition of Done
  No `images.js` static-import arrays remain; no runtime canvas thumbnailing path remains; every gallery surface reads built webp manifest output; grep-clean of `import.meta.globEager`; galleries still render via react-image-gallery. AC-009.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
