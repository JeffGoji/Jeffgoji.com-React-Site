    body: "[STRAP/agent:dev-lead] Resolved. Added `.rotate()` to the `outThumb`/`outDisplay` sharp chains in `processOne()` (`scripts/build-gallery.mjs`), mirroring the `outOriginal` idiom from Task 00074 -- bare `.rotate()` before `.resize()`, bakes EXIF orientation into pixels since the pipeline never calls `.withMetadata()`. Full gallery rebuilt from scratch (286 sources across 6 galleries). Verification caught and corrected a real data error in this Task's own filed description: the 17-file split as written (nd-hillcountry x10, nc-eastcoast15 x4, nd-totd2025 x1, nc-yellowstone15 x1) summed to 16, not 17. Re-measured directly off source EXIF: nd-hillcountry is x11, giving 11+4+1+1=17, consistent with the 12x90deg/5x180deg orientation-type count. Verified two ways: (1) dimension sweep over all 286 sources x 3 renditions, 0 failures -- every thumb/display now matches the as-displayed (post-rotation) aspect ratio rather than the stored one; (2) pixel-level proof on the 17 rotated frames -- each thumb+display rendition's raw pixels diffed against the old (pre-fix) rendition rotated by its EXIF angle, confirming the correct rotation direction (not just corrected dimensions) and ruling out a 180-degrees-off fix -- 34/34 rendition checks passed. All 269 identity-orientation frames confirmed byte-dimension-unchanged (no regression). Full test suite: 939/939 passed. Production build (gallery + articles + hero + og + vite) clean, no new warnings. Scratch verification scripts (t76-probe.mjs, t76-verify.mjs) used to produce the above, removed before this commit -- not shipped."
