  Combine with Story 00042's perf-baseline doc into one `.claude/strap/project-docs/v1-baseline.md` (dev-lead merges). Enumerate the analytics goals/events the tool must expose; note the short-window caveat.
  ## Dependencies
  Predecessor: 00050 (analytics live). Reconcile with Story 00042 baseline task (00048).
