  # Manifest schema enhancement: per-image thumbnailAlt + label

  ## Description
  The mockup lightbox wants a per-image caption + thumb alt, but `build-gallery.mjs processOne` (:53-90) emits only `alt`/`description`/`originalAlt` (the last a generic gallery label, same for every item). Emit per-item `thumbnailAlt` + a per-image `label` (derive from `parseDateAlt` — the date-stamped string is a sensible label; fall back to `${g.label} — ${filename}`). This is the data contract Feature B Story 00029's hub + lightbox bind to.

  ## Linked Story
  **Story:** 00044
  ## Original Estimate
  **Hours (senior-developer):** 3
  ## Implementation guidance
  Coordinate the exact field names with Feature B Story 00029 so the consumer matches.
  ## Dependencies
  Predecessor: 00053 (same file, generalized first). Consumer: Feature B Story 00029.
  ## Definition of Done
  Emitted manifest items carry `thumbnailAlt` + `label`; existing fields unchanged; `nd-totd2025` manifest visibly gains per-image captions; contract confirmed against Story 00029.
