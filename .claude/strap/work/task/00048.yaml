  # Capture V1 perf baseline (Lighthouse + image-weight + LCP)

  ## Description
  Against the CURRENT V1 build, record for BOTH the home page and the representative `nd-totd2025` gallery: Lighthouse Performance desktop + mobile; cold-load transferred image bytes (network waterfall); LCP on a mid-tier mobile profile. This is the reference set AC-006 (>=50% image-byte reduction), AC-007 (LCP <=2.5s), AC-008 (Lighthouse >=90/>=80) are scored against in C2. Record methodology so C2 re-measures identically.

  ## Linked Story
  **Story:** 00042
