  # Author the /whats-new route-presence test (reconcile with Feature A route-parity guard)

  ## Description
  Author a Vitest+RTL test asserting `/whats-new` renders the WhatsNew page (both regions present) and the route is registered in `App.jsx`. Contribute the `/whats-new`-present assertion to the SHARED route-parity guard (Feature A Story 00011 / Task 00025) rather than duplicating.

  ## Linked Story
  **Story:** 00061
  ## Original Estimate
  **Hours (senior-developer):** 3
  ## Implementation guidance
  CORRECTED 2026-08-06 (Task 00064's own report caught two errors in this brief as originally filed): this repo has NO `__tests__/` folders anywhere — the actual convention is co-located `<Module>.test.jsx` next to the module, which Task 00064's own `src/components/WhatsNew/index.test.jsx` already follows. Do not create a `__tests__/` directory. Task 00064's page-shell test deliberately defers route-registration assertion to this Task ("Task 00066's contribution to the shared route-parity guard in src/App.test.jsx" — see its docblock) — so this Task's real target is `src/App.test.jsx`, contributing a `/whats-new` presence case to the existing shared route-parity guard rather than a new standalone WhatsNew test file. Render via `MemoryRouter initialEntries={['/whats-new']}` (or App's existing harness pattern) and assert the WhatsNew page renders at that path. Also reconcile `src/components/Footer/index.test.jsx:206`, which currently excludes `/whats-new` from its "every footer link resolves to a route" parity check with a comment saying the route doesn't exist yet — that's now stale and hides a real regression if the route were ever removed; update it to expect `/whats-new` to resolve like every other footer link. (Separately noted, not this Task's scope: the same Footer test's `served` route set lists `/gallery` but not `/galleries` — worth a follow-up look, but don't fold it in here.)
  ## Dependencies
  Predecessor: 00064 (resolved — merged into feature/00006-whats-new-page). P9 Vitest harness (Feature A Story 00011). Reconcile with Feature A route-parity guard (Task 00025) in `src/App.test.jsx`.
  ## Definition of Done
  Test authored + colocated; asserts route presence + page render; documented as D-side contribution to the shared guard.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
