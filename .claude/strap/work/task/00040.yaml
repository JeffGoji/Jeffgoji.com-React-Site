  # Re-skinned react-image-gallery lightbox

  ## Description
  Mount `react-image-gallery` re-skinned to the mockup lightbox visuals (`.lightbox` chrome, `.media--editorial--soft`, close/prev/next, keyboard ←/→/Esc + swipe, caption "NN / total · label"); data from manifest items `{original, thumbnail, alt}`. Fall back to the gallery label where per-image `label` is absent (Wiring-Guide mismatch).

  ## Linked Story
  **Story:** 00029
  ## Original Estimate
  **Hours (senior-developer):** 5
  ## Implementation guidance
  `react-image-gallery` is already a dependency. Mockup gallery.html lightbox. `--soft` grade in the lightbox preserves detail.
  ## Dependencies
  Predecessor: 00039 (hub grid). Feature C manifests.
  ## Definition of Done
  Lightbox opens on thumb click; prev/next wrap; Esc closes; caption format correct; responsive. Tests authored.
  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
