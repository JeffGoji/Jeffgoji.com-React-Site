  # Add the permanent red 'What's New' nav pill

  ## Description
  Add a top-level nav item styled as `.nav__link--flag` (red pill, `--goji-red`, hover `--goji-red-bright`) pointing at `/whats-new`, present on every page. Feature A only adds the pill — the `/whats-new` route + page are Feature D (P7).

  ## Linked Story
  **Story:** 00010

  ## Original Estimate
  **Hours (senior-developer):** 3

  ## Implementation guidance
  Style per `app.css:101-105` + the mobile `:574` treatment. The link target (`/whats-new`) will 404 until Feature D ships the route — acceptable (A owns the pill, D owns the route).

  ## Dependencies
  Predecessor: 00020 (nav structure exists first).

  ## Definition of Done
  The red What's New pill renders in the primary nav on all routes and links to `/whats-new`; pill styling matches the mockup incl. the mobile treatment.

  ## Quality Checklist
  - [x] One-paragraph description; Story linked; estimate >=3h; real files; DoD testable.
