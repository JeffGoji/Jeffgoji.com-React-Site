  # Redesign jeffgoji.com to a dark motorsport-editorial V2: enthusiast-native visual system, consolidated image-loading performance pipeline, and a self-documenting "What's New" page

  ## Overview

  This Spec implements V2 of jeffgoji.com — a full "new everything" redesign of a client-only React 18.2 + Vite 4.4 SPA (React Router v6 flat route table at `src/App.jsx:47-68`; Netlify static hosting; no backend). Three goals: (1) apply a cohesive dark motorsport-editorial visual system (black + red core palette, refined toward a premium red; new logo/layout/components) across every primary surface — home, the four Miata/C8 blogs, articles, suspension, videos, and all galleries; (2) overhaul image delivery — consolidate the site's three unconsolidated gallery-wiring patterns onto the single build-time `sharp->webp` pipeline (`scripts/build-gallery.mjs`), add responsive `srcset`/`sizes` + below-fold `loading="lazy"`, fix the multi-MB OG image, drop the vestigial `target:'es2015'` de-opt, and pin Node — to hit >=50% image-weight reduction, LCP <=2.5s mobile, and Lighthouse >=90/>=80; and (3) ship a permanent "V2 What's New" nav page authored from actually-delivered work in an entertaining Top Gear/Clarkson voice. Analytics (cookieless, e.g. Plausible) is added and a V1 baseline captured early so the engagement + perf gains are provable. All existing content is preserved and re-presented; AdSense stays inert but its wiring is not broken; dead bits (orphaned `/totdtrip`, "coming soon" placeholder) are cleaned up.

  **Source Requirement:** 00001 (`related` link) — RESOLVED 2026-08-01.

