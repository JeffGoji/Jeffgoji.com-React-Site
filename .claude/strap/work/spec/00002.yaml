  **Run command:** open `.claude/strap/mockups/spec-00002/index.html` in a browser (no build/server).

  **Key design decisions:**
  - **Palette (softer-dark, FINAL):** charcoal canvas `#141418`, deep chrome `#0F0F12`, ink ramp `#1A1A1F/#202027/#26262E/#33333B/#45454E`; **reading panel `#202027`** (elevated, for long-form prose ~17px / 1.7 leading / 68ch); text warm off-whites `#F1EEE9` (headings ~16:1) / `#D8D4CD` (body ~12:1) / `#9C978D` (muted ~6:1). Brand red `#E10600` (hover `#FF1A0E`, pressed `#B00500`, oxblood `#3A0705`) — the only saturated hue. Softened from pure black/white after the first mockup approval for reading comfort.
  - **Type:** Archivo (display/headings, uppercase tight-tracked), Inter (body/blog), Space Mono (telemetry chips: date/mileage/cost).
  - **Logo:** "The Goji Line" — racing line through a corner apex bent into a "G" with a white apex dot + "JEFF**GOJI**" wordmark (GOJI in red). Recolours via token.
  - **Patterns:** sticky blur navbar, red-underline active state, permanent red "What's New" pill; full-bleed hero with dual scrim + checkered-flag accents; number tags on cars; card hover (lift + image zoom).
  - **Editorial image treatment (reusable — P3/P5):** `.media--editorial` = CSS `filter(brightness .95 / contrast 1.06 / saturate .90)` on the `<img>` + a `mix-blend-mode:multiply` `::after` overlay (faint charcoal↓/oxblood↑ tone + soft vignette with a clear center so the car stays untouched); `--hero` (heavier) and `--soft` (lightbox) modifiers; all keyed off `:root` grade vars. Apply to `.hero__media`, `.card__media`, `.thumb`, `.post__media`; copy the `:root` grade vars into tokens/SCSS. Restrained on purpose — cars stay recognizable, not a duotone. Fixes the bright-snapshot-vs-dark-design mood mismatch.
  - **Rotating hero (P2/P3 — the repo's Random-Background-Feature):** the home hero randomly picks one of 5 per-car shots on each load (NA night-skyline, MSM wet-autocross-spray, NC mountain overlook, ND country-road beauty, C8 crepe-myrtle evening) with a "TODAY IN THE GARAGE" Space-Mono nameplate. Ports as a `heroes[]` array + `useState(() => heroes[random])` on mount (session-stable, no reshuffle on re-render). Convert the 5 heroes to responsive webp for goal-2.
  - **PORT CAVEAT (#1 gotcha for P5):** declare the Sass `$theme-colors` map BEFORE `@import bootstrap` — otherwise the override stays ineffective (the current `styles.scss:2` bug). `assets/tokens.css` header documents this.

  **Build-time photo follow-ups (design-approved; not blockers — handle during P3/P4):**
  - Re-encode the NC hero + gallery source (`nc/15east/*`, 2–9MB) to webp for a crisp NC hero.
  - Convert the 5 rotating heroes to responsive webp `srcset` (goal-2 performance).
  - Gallery frames carry a faint "© David Leung Photography" credit (visible in the lightbox) — CPO to decide: accept as credit, crop, or lighten treatment.
  - Gallery uses C8 autocross frames as stand-ins under "Tail of the Dragon" labels — wire real TOTD webp renditions when built (raw frames at `nd/TOTD2025/action/*`, 5–8MB, need optimization).

