  - [x] Per-section technical depth names real files/components/paths.
  - [x] Every Requirement Success Criterion maps to at least one Acceptance Criterion.
  - [x] Every Acceptance Criterion has a stable ID and is testable.
  - [x] Assembly Order documents predecessors/successors (baseline-first ordering explicit).
  - [x] Test Strategy specifies coverage per part and test types.
  - [x] Dependencies explicit; no Federation/cross-product entries.
  - [x] Every Open Question resolved — SQ-001..SQ-007 dispositioned 2026-08-01 (see SQ dispositions above); SQ-002/003/006 design specifics finalize through the mockups.
  - [x] Senior dev could implement from this Spec alone — pending only the Mockup Wiring Guide, injected via /analyze-mockups after the mockups are approved.
