  ## Mockup Interview Summary

  Intent: dark motorsport-editorial V2 — black + premium racing red, new SVG logo, mobile-first (360/768/1024/1440), AdSense out. Audience: car enthusiasts + autocross / great-drives fans. Fidelity: **Tier 1 (verbatim port / contract)** — the frontend ports the mockups exactly. Built via `/create-mockups` and **CPO-approved 2026-08-01**. Fonts confirmed: Archivo / Inter / Space Mono, self-hosted in production (SQ-006 resolved — replaces Bangers/Cinzel/Praise). CSS approach confirmed: Bootstrap 5.3 base + SCSS design-token layer (SQ-002 resolved).

  ## Mockup Reference (authoritative for implementation)

  The mockups are the visual contract. Implementation reads the mockup source directly for fidelity; this section is the pointer + non-obvious decisions.

  **Mockup files** (all under `.claude/strap/mockups/spec-00002/`):

  | File | Contributes |
  |---|---|
  | `index.html` | Hub linking every view |
  | `design-system.html` | Palette (with hex) / type scale / components / states / logo — the reference |
  | `home.html` | Hero → intro → garage preview → video grid |
  | `garage.html` | 5-car hub; number-tag cards; retired-car tribute state |
  | `blog.html` | Car-identity banner + paginated build log (3/page), telemetry chips, markdown entries |
  | `gallery.html` | Thumbnail grid → keyboard/swipe lightbox (mirrors react-image-gallery) |
  | `whats-new.html` | Permanent-nav feature page; Clarkson-voice entries tagged Why→goal / How→shipped |
