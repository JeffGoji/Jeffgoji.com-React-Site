  ## Mockup Wiring Guide (authoritative for the port — written by /analyze-mockups)

  Bridges the mockup data/stubs to the REAL client-only contracts (no backend). Does NOT duplicate colors/layout/CSS — the mockup files are the verbatim visual contract. Mockup dir: `.claude/strap/mockups/spec-00002/`.

  **Completeness:** mostly covered, **0 blocking gaps.** Suspension / NaMiata / GoodbyeC8 have no dedicated mockup — implementers extend the `.post` / `.card` / `.media--editorial` / section-head component language (Tier-1 reuse, not invent).

  **Adopted design deltas (CPO-ruled 2026-08-01 — extend P3):**
  - **Galleries consolidate to a single hub** (`/galleries`) with a "choose set" switcher (matches the mockup). The current per-gallery routes (`/msm-gallery`, `/nc-eastcoast15`, `/nc-yellowstone15`, `/nd-hillcountry`, `/c8-autox`, `/totdgallery`) redirect into the hub. Supersedes "re-skin each gallery route" in P3; folds together with P4's wiring consolidation.
  - **Videos use a click-to-load poster facade** (data-driven) instead of eagerly mounting 3 YouTube `<iframe>`s (`YouTube/index.jsx`). Performance win (AC-010); `videos` becomes an array.

  **Data-shape → real-contract mapping (17 match / 3 rename / rest additive):**
  - **cars** (`MOCK.cars` → `src/components/Garage/Cars.json`): `id/make/model/year/name/description` match. `bloglink` — keep the REAL Router paths (`../na-blog` etc.; retired NC = `/`), not the mock's `blog.html`/`#`. NET-NEW (add to Cars.json or derive in component): **`img`** (car photo, webp), `label` (e.g. "1991 NA6"), `tag` (kicker).
  - **blog** (`MOCK.blog[key]` → `src/assets/Data/{naBlog,MsmBlog,ndBlog,c8Blog}.json`): `id`(unique numeric — load-bearing for sort + React key)/`date/mileage/cost/entry` match. `picture` shape matches but PATH differs — real is root-relative w/o leading slash from `public/images/`; for AC-010 repoint to optimized webp renditions. `label` is net-new display-only (optional). Markdown `entry` renders via react-markdown+remark-gfm (see stub list).
  - **gallery** (`MOCK.gallery` → `public/gallery/<slug>/manifest.json` items from `scripts/build-gallery.mjs`): `original`/`thumbnail` match (real = webp display/thumb paths). `gallerySlug`→`manifest.id`, `galleryTitle`→`manifest.label` match. MISMATCH: real `originalAlt` = the generic gallery label per item (not per-image); real script emits `alt`+`description` but NOT `thumbnailAlt` or a per-image `label` (the mockup lightbox caption/thumb-alt want these → build-script enhancement, logged against P4). Empty mock items model the loading/missing state; real manifest omits failed files (→ `skipped[]`). No manifest is built on disk yet — needs `npm run gallery:build` against real TOTD frames.
  - **videos** (`MOCK.videos` → `YouTube/index.jsx`, currently hardcoded): lift the 3 real ids (`UySrXUfHA_k`, `Q2B8mA3vgP0`, `XVjs7LRCBak`) into a `videos` array; `meta` (duration/category) is net-new authored.
  - **heroes / metrics / whatsNew** — NET-NEW whole shapes (no existing contract). heroes → `heroes[]` + `useState(() => heroes[random])` on mount (Random-Background-Feature, session-stable); metrics → build-time Lighthouse/perf-budget outputs (TARGET vs SHIPPED badge); whatsNew → tech-writer authors in P7 from shipped P1-P4 work.

  **Stub → production-source replacements (for the port):**
  - `app.js renderMarkdown()` (regex mini-markdown) → existing **react-markdown + remark-gfm** with the custom p/img/a renderers in `blog/*/index.jsx`. STANDING SECURITY RULE: no rehype-raw, no dangerouslySetInnerHTML.
  - `app.js ph()` SVG placeholder → real `<img>` webp with responsive `srcset`/`sizes` + below-fold `loading="lazy"` (AC-010).
  - `app.js mountGallery()` lightbox → **react-image-gallery** re-skinned to the mockup visuals; data via `fetch('/gallery/<slug>/manifest.json')`. Retire pattern-(a) static `images.js` Vite-import arrays, pattern-(b) runtime canvas thumbnailing (`_thumbs/thumbs.js`+`chunk.js`), and the deprecated `import.meta.globEager` (AC-009).
  - `home.html rotateHero` IIFE → React `heroes[]` + `useState` random-pick-on-mount in `Home`.
  - `app.js renderShell()` → rebuilt `NavMenu` + `Header` + the dormant `components/Footer/index.jsx` (wire it in). `assets/logo.svg` replaces the `logo.gif` import.
  - home video grid → data-driven poster-facade replacing `YouTube/index.jsx` eager iframes.

  **Production concerns the mockup elides (implementers MUST wire):**
  - PRESERVE all real `index.html` SEO/OG/Twitter/JSON-LD meta; only swap the OG/Twitter/JSON-LD image to the optimized ~1200x630 (<200KB) rendition (AC-011). Mockup `<head>` has none.
  - KEEP AdSense global script + `google-adsense-account` meta + `AdSenseSlot` present-but-inert; enable no slot (AC-017).
  - Markdown-only render (AC-016); responsive srcset + lazy-load (AC-010); hero rotation session-stable; cookieless analytics is P6 (tool TBD, no cookies, AC-003); self-host the Archivo/Inter/Space Mono fonts (SQ-006).
  - P5 #1 gotcha: declare Sass `$theme-colors` BEFORE `@import bootstrap`; copy `tokens.css` `:root` vars (incl. the `.media--editorial` grade vars) into the SCSS.
  - Build-time photo follow-ups (already logged): NC webp re-encode, hero webp srcset, gallery "© David Leung Photography" credit decision, real TOTD frames (mockup uses C8-autocross stand-ins).

  ## Acceptance Criteria

  - **AC-001:** Every primary route in `App.jsx:47-68` (plus new `/whats-new`) renders under the V2 design system — no surface retains the pre-V2 Bootstrap-default-navbar / `style.css` look. Verified by route-by-route visual audit.
  - **AC-002:** The redesigned shell (`NavMenu`, `Header`, a rendered `Footer`) applies the new logo (no `logo.gif`) and the premium black+red palette; the "NA Miata (coming soon)" placeholder is removed.
  - **AC-003:** A cookieless, privacy-respecting analytics tool (e.g. Plausible) loads on all routes and records pageviews + engagement; NO cookies set (verified in browser storage/network).
  - **AC-004:** A V1 engagement + perf baseline is captured and recorded in-repo BEFORE V2 UI ships, enabling a documented before/after; post-launch engagement meets the confirmed target (working: +15% dwell, measurable pages/session rise).
  - **AC-005:** At viewport widths 360/768/1024/1440, every primary route renders with no horizontal overflow and no broken layout; the navbar collapses to a mobile menu at the mobile breakpoint.
  - **AC-006:** Transferred image bytes on the home page and the representative gallery (`nd-totd2025` / Tail of the Dragon) are >=50% below the V1 baseline for the same pages (cold-load network waterfall).
  - **AC-007:** LCP on the home page and representative gallery is <=2.5s on a mid-tier mobile profile.
  - **AC-008:** Lighthouse Performance >=90 desktop and >=80 mobile on the home page and representative gallery.
  - **AC-009:** All three gallery-wiring patterns are consolidated onto the `scripts/build-gallery.mjs` `sharp->webp` pipeline; no gallery ships runtime canvas thumbnailing (`_thumbs/thumbs.js`) or full-res Vite-imported originals; every gallery reads built webp output.
  - **AC-010:** Across all image-bearing surfaces, images are webp with responsive `srcset`/`sizes` and below-fold images use `loading="lazy"`; no page ships a full-res original where a smaller rendition suffices.
  - **AC-011:** The OG/Twitter/JSON-LD social image in `index.html` (currently a multi-MB JPG) is replaced with an optimized ~1200x630 (<200KB) image; all other SEO/OG/Twitter/JSON-LD metadata is unchanged/non-regressed.
  - **AC-012:** `vite.config.js` `target:'es2015'` is removed (default esbuild target restored); SSR residue (`Object.hasOwn` polyfill in `main.jsx`, `custom-render-ready` dispatch `App.jsx:38-40`) removed without breaking render.
  - **AC-013:** Node is pinned (`.nvmrc` and/or `NODE_VERSION`) to >=18.17 (satisfies `sharp@0.34`); a clean Netlify build (`npm run build`) succeeds.
  - **AC-014:** A "V2 What's New" page exists at a reachable route (`/whats-new`) and is a permanent top-level primary-nav item present on every page.
  - **AC-015:** The What's New page enumerates the V2 changes; each entry states WHY + HOW it advanced goal 1 and/or goal 2, every claim traceable to shipped work (no aspirational items), in the specified Top Gear/Clarkson tone.
  - **AC-016:** All existing blogs, the Goodbye-C8 article, all galleries, videos, and suspension content remain reachable and intact; the render path stays `react-markdown`+`remark-gfm` with NO `dangerouslySetInnerHTML`/raw-HTML introduced.
  - **AC-017:** Existing AdSense wiring (global script + `google-adsense-account` meta in `index.html`, `AdSenseSlot`) remains present and non-erroring while all slots stay inert; no slot is enabled in V2.
  - **AC-018:** The orphaned `/totdtrip` route (`App.jsx:61`) and the "coming soon" placeholder are removed.

  **SC -> AC map:** SC-001 -> AC-001, AC-002 · SC-002 -> AC-003, AC-004 · SC-003 -> AC-005 · SC-004 -> AC-006 · SC-005 -> AC-007 · SC-006 -> AC-008 · SC-007 -> AC-009, AC-010, AC-011 · SC-008 -> AC-014 · SC-009 -> AC-015. Cross-cutting enablers/constraints: AC-012, AC-013 (perf/build); AC-016, AC-017, AC-018 (content-preservation + AdSense + cleanup). Every SC-001..SC-009 maps to >=1 AC.

  ## Assembly Order

  - **Phase 0 (start immediately, parallel):** **P6 baseline** — analytics + V1 engagement/perf baseline MUST be captured before any V2 UI or perf change lands (otherwise >=50%/LCP/Lighthouse gains are unprovable). Low-risk P4 enablers (Node pin AC-013, drop `es2015`/SSR residue AC-012) can also land now.
  - **Phase 1:** **P1 Design System** + **mockups** (produced via `/create-mockups` AFTER this Spec) — PREREQUISITE for all client-ui redesign. **P5 styling reconciliation** lands the design tokens/foundation and fixes the `$theme-colors` import-order bug.
  - **Phase 2:** **P2 Shell/Nav/Footer** — depends on P1+P5. Adds the permanent What's New nav slot.
  - **Phase 3:** **P3 per-surface redesign** — depends on P1+P5+P2. **P4 image-perf overhaul** runs parallel/interleaved with P3; P4 perf changes must land AFTER the P6 baseline.
  - **Phase 4:** **P7 What's New page** — LAST; authored from actually-shipped P1-P4 work (AC-015 traceability).
  - **Cross-cutting:** **P8 security review** + **P9 tests** parallelize with each phase's target layer.
  - **Mockup prerequisite:** designer mockups (dark motorsport-editorial, black+red) must exist before P2/P3 implementation; the **Mockup Wiring Guide will be injected into the P2/P3/client-ui sections later via `/analyze-mockups`** — not authored now.

  ## Test Strategy

  Stack: **Vitest + React Testing Library + jsdom** (no tests exist today). Centralized execution: `npm test` (= `vitest run`), run only by dev-lead.

  - **P3/blogs:** data-integrity (unique numeric `id` — sort `b.id-a.id` + React `key` assume it), pagination behavior (3/page), and — if collapsed — a data-driven `<BlogList>` renders each JSON source.
  - **P2/P7 routing:** route-parity guard — `App.jsx` routes vs `NavMenu` links, asserting new `/whats-new` present and `/totdtrip` removed.
  - **P4 pipeline:** unit-test pure helpers in `build-gallery.mjs` (`parseDateAlt`, `sortKeys`, `cleanName`) after an export-refactor; `_thumbs/chunk.js` `buildChunkMap`.
  - **P4 perf (manual, dev-lead-run):** Lighthouse desktop+mobile on home + `nd-totd2025` gallery (AC-007/008); cold-load network-weight vs baseline (AC-006).
  - **P1/P2/P3 responsive (manual/visual):** audit at 360/768/1024/1440 for overflow/layout (AC-005); route-by-route visual audit (AC-001).
  - **P8 security:** assert no `dangerouslySetInnerHTML`/raw-HTML introduced; markdown path intact; OG/JSON-LD/AdSense meta present.

  ## Dependencies

  - **Analytics tool** — cookieless/privacy-respecting (e.g. Plausible); external script/service. Exact tool = SQ-001.
  - **`sharp@0.34`** native binary + **Node >=18.17** pin — build prerequisite; `sharp` is the single most fragile build link; Netlify's per-push build IS CI (do NOT add GitHub Actions).
  - **Designer mockups** — prerequisite output (via `/create-mockups`) for P2/P3; `/analyze-mockups` injects the Wiring Guide.
  - **`react-image-gallery`** — consuming component for the consolidated galleries (items = `{original, thumbnail, ...}`).
  - **No backend, no database, no federation, no cross-product deps.** Single Netlify deploy target.

  ## Open Questions

  - **SQ-001** (CPO): Exact analytics tool — Plausible (hosted vs self-host) vs Fathom/Umami? Confirm the cookieless choice + how it's loaded.
  - **SQ-002** (CPO/frontend-engineer): Is a CSS/component approach prescribed for the new design system — reconcile onto Bootstrap 5.3 + custom SCSS (recommended, least churn), or introduce CSS Modules / a different utility framework?
  - **SQ-003** (CPO/designer): Logo creation path — designer deliverable or CPO-supplied? Confirm SVG (current is `.gif`).
  - **SQ-004** (CPO/devops): Confirm `nd-totd2025` (Tail of the Dragon) as the "representative gallery" for SC-004/005/006 measurements.
  - **SQ-005** (CPO): Engagement baseline needs analytics live on V1 for a data window before V2 UI ships — given "best-effort" timeline, is a short window / perf-only baseline acceptable if engagement data is thin?
  - **SQ-006** (CPO/designer): Fonts — keep/replace/self-host the current `Bangers/Cinzel/Praise` Google Fonts (self-hosting helps perf)?
  - **SQ-007** (CPO): Dead-file deletion scope — confirm which "verify-with-owner" dead items may be removed in V2 (`entry-ssr.jsx`, misplaced asset-tree gallery components, `Gallery/NB/index.jsx` switcher, `firebase` + `react-image-file-resizer` deps, root `ads.txt`).

  ### SQ dispositions (CPO, 2026-08-01)
  - **SQ-001 — DEFERRED to P6 execution.** Spec analytics against a generic cookieless script-tag integration; CPO picks the exact tool (Plausible / Umami-self-host / Fathom) before P6 runs.
  - **SQ-002 — DEFERRED to /create-mockups.** Working default: keep Bootstrap 5.3 as the base + a real SCSS design-token layer (least churn); the mockups confirm the final CSS/component approach.
  - **SQ-003 — RESOLVED.** New logo is a `designer` deliverable, authored as SVG during /create-mockups.
  - **SQ-004 — RESOLVED.** Representative gallery for SC-004/005/006 measurements = `nd-totd2025` (Tail of the Dragon).
  - **SQ-005 — RESOLVED.** Capture the perf baseline immediately; the engagement baseline is best-effort over a short window (perf-only acceptable if engagement data is thin), given the no-hard-deadline timeline.
  - **SQ-006 — DEFERRED to /create-mockups.** Fonts are the designer's call; self-host for performance.
  - **SQ-007 — RESOLVED.** Yes — remove the confirmed-dead items during V2 (`entry-ssr.jsx`, misplaced asset-tree gallery components, `Gallery/NB/index.jsx` switcher, `firebase` + `react-image-file-resizer` deps, root `ads.txt`).

