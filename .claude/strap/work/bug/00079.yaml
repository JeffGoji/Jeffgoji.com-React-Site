    body: "[STRAP/agent:dev-lead] State: active -> resolved (via /fix-bugs). Commit d5d1f78 on fix/00079-gallery-dropdown-selection. Completed By: frontend-engineer. One mechanism fixes both CPO-confirmed scope items: gallerySets.js's new galleryHubPath(slug) builds /galleries?set=<slug>, validated against the live GALLERY_SETS config so a renamed/removed slug degrades to the default landing rather than a dead query. NavMenu's six dropdown entries repointed directly at galleryHubPath() (also retiring the stale 'route doesn't exist yet' docblock); the legacy per-gallery redirects now carry the same slug through LEGACY_GALLERY_REDIRECTS, so old bookmarks (e.g. /nc-yellowstone15) resolve correctly too -- both in-scope requirements satisfied by one data flow. Two real traps caught and handled, one of them NOT flagged in the original investigation: (1) the investigation's own flagged remount trap (GalleryHub's initialSlug seeds once, so nav-clicking a different set while already on /galleries wouldn't update the display) -- solved by keying the route element on location.key rather than the search param itself, specifically so re-clicking a nav entry after the in-page switcher moved elsewhere still navigates correctly, and specifically NOT keyed on the param so the switcher's own selections (which write no URL) can never be silently overwritten by a stale seed; (2) NEW finding: NavLink's active-match ignores the query string, so if the six entries had stayed NavLinks sharing /galleries as their pathname, all six would have painted themselves 'active' simultaneously the instant the hub was open -- changed to plain Links, guarded by a new test. Correctly did NOT make the in-page switcher URL-syncing, matching the CPO's explicit scope decision. Existing stale test (App.test.jsx:175, pinning /totdgallery) rewritten to the new contract rather than deleted, matching this project's established convention; its GalleryHub mock was also upgraded to reproduce real seed-once semantics, since a naive always-fresh stub would have passed this exact bug undetected. 153 real tests pass in the four affected files per the agent's own run; re-verified centrally: 1064/1064 full suite, clean build. One real process error on dev-lead's part surfaced by the agent: the worktree was created with a scratch branch (fe-00079-work) instead of the intended fix/00079-gallery-dropdown-selection, because that branch was already checked out in the primary checkout when the worktree was cut -- git cannot check out the same branch twice. Agent recovered cleanly via a clean rebase + fast-forward push, no data lost, no force-push needed. Noted for future worktree creation: never git checkout -b the target branch in the primary checkout before cutting its worktree."
