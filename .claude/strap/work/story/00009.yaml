  # Reconcile the three styling systems onto the V2 token layer

  ## Description
  Assemble the P1 partials (_tokens/_theme/_fonts/_grade) into `styles.scss` with the CORRECT import order (partials BEFORE `@import bootstrap` — this executes the `$theme-colors` fix; the current `styles.scss:2` orders it after, so the override is ineffective), and collapse the three overlapping CSS entry paths (Bootstrap utils + the separately-compiled `scss/styles.scss` via `scss/js/main.js` script tag + legacy `assets/css/style.css` + inline) into one token-driven system. NOTE: authoring the partials themselves is ST-1/ST-2 (designer); this Story is the WIRING/assembly, deliberately dedup'd from the design stories.

  ## Linked Feature
  **Feature:** 00003

  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P5 — Styling-system reconciliation

  ## Acceptance Criteria subset
  Contributes to **AC-001** (no surface retains the pre-V2 Bootstrap-default/`style.css` look); enables **AC-002** palette.

  ## Implementation notes
  Real files: `src/scss/styles.scss` (assemble the partials, correct order), `src/scss/js/main.js` (fold its Bootstrap-JS import into the React entry, drop the separate `<script>` at `index.html:96`), `src/assets/css/style.css` (migrate needed rules, remove `App.jsx:34` import), `src/main.jsx` (import SCSS here). Keep Bootstrap 5.3 as the base (SQ-002). Remove old `.color-primary-*`/`.bg-primary-*` blue utilities.

  ## Dependencies
  **Depends on ST-1 (00007) + ST-2 (00008)** — consumes the partials/fonts. Predecessor to ST-4 + ST-5 (shell consumes the reconciled tokens).

  ## Quality Checklist
  - [x] Concrete; Feature+Spec populated; AC ids verbatim; real files; deps explicit; 2 Tasks.
