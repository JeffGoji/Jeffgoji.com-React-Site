  # Establish the V2 SCSS design-token foundation (tokens + Bootstrap theme map + editorial grade)

  ## Description
  Port the approved mockup design tokens into production SCSS as three importable partials — a CSS-custom-property `:root` layer, a Sass-var + Bootstrap `$theme-colors` override layer, and the reusable `.media--editorial` grade layer. These are the single design-token source of truth that ST-3 (P5) assembles into `styles.scss` (import-order-correct) and P2/P3 consume. Retires the off-brand `#ff0000` + blue palette.

  ## Linked Feature
  **Feature:** 00003

  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P1 — Design System & Visual Language

  ## Acceptance Criteria subset
  Contributes to **AC-002** (palette/token half; shell render verified in ST-4) and is the foundation for **AC-001**.

  ## Implementation notes
  NEW `src/scss/_tokens.scss`, `_theme.scss`, `_grade.scss`. Source of truth: `.claude/strap/mockups/spec-00002/assets/tokens.css` (:root) + `app.css:201-242` (grade vars). Existing retired blues at `src/scss/styles.scss:11-26`. Keep tokens as CSS custom props AND mirror palette into Sass vars where Bootstrap's map needs literals. Deliberate exceptions (nav/hero scrims keep `rgba(5,5,6,…)`; logo keeps `#F6F6F4`) are NOT stragglers.

  ## Dependencies
  None upstream (mockups approved). BLOCKS ST-3 (P5 reconciliation consumes these partials) and P2/P3.

