  # Port the telemetry instrument cluster + numbered changelog ledger components

  ## Description
  Build the two data-driven presentational clusters as small composable children, porting whats-new.html structure + app.css styling verbatim (Tier-1). The instrument cluster renders the status telltale strip + `metrics[]` stat tiles (delta arrows, meter bars, TARGET/SHIPPED bezel badges); the changelog ledger renders the numbered `whatsNew[]` entries with category + GOAL chips and WHY→/HOW→ readout. Metric badges wire to Feature C build-time perf outputs where available (TARGET fallback until real numbers land).

  ## Linked Feature
  **Feature:** 00006
  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P7 — "V2 What's New" page (route + content)
  ## Acceptance Criteria subset
  AC-015 (enumerated entries render with WHY/HOW; badges reflect shipped-vs-target), supports AC-014.
  ## Implementation notes
  Real files: new `src/components/WhatsNew/{InstrumentCluster.jsx,Changelog.jsx}` + page SCSS (port `.wn-dash`/`.tele-*`/`.cl-*` from mockup app.css into the design-system SCSS; tokens owned by Feature A/P5). Mockup structure verbatim (whats-new.html:63-97). Children are pure presentational, typed props from Story 00061, no reach-through. Entry title/body/why/how render as PLAIN TEXT — no markdown/raw HTML, no dangerouslySetInnerHTML (AC-016 standing rule).
  ## Dependencies
  **Predecessor: Story 00061** (scaffold + data module). Feature A/P5 tokens. Metrics wiring (task 00069) depends on Feature C perf outputs. tech-writer content values (Story 00063).
  ## Quality Checklist
  - [x] Concrete; Feature+Spec populated; AC ids verbatim; real files; deps explicit; 3 Tasks.
