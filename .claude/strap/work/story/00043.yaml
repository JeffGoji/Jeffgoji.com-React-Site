  # Cookieless analytics + engagement baseline (Phase 0)

  ## Description
  Stand up a cookieless, privacy-respecting analytics script in `index.html <head>` firing pageviews + engagement on ALL routes with NO cookies; wire SPA route-change pageviews (React Router v6 is client-only — a bare script tag counts first-load only); capture the V1 engagement baseline in-repo before V2 UI ships. Preserve all existing SEO/OG/Twitter/JSON-LD meta; keep AdSense present-but-inert.

  ## Linked Feature
  **Feature:** 00005
  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P6 (analytics + engagement-baseline half)
  ## Acceptance Criteria subset
  AC-003, AC-004 (engagement half), AC-017.
  ## Implementation notes
  Real files: `index.html` (head; insert analytics near :80, DO NOT touch existing meta/JSON-LD/AdSense tags), new `src/hooks/usePageviews.js` + `src/lib/analytics.js` (thin wrapper so SQ-001's tool pick is a 1-line swap), `src/App.jsx` (mount hook), `src/components/AdSense/AdSenseSlot.jsx`, baseline doc under `.claude/strap/project-docs/`. SQ-001 tool (Plausible/Umami/Fathom) TBD — spec against a generic cookieless script tag.
  ## Dependencies
  None on Feature B. Blocks A/B merge on baseline. Reconcile with Story 00042 on the single index.html head edit + a combined baseline doc.
  ## Quality Checklist
  - [x] Concrete; Feature+Spec populated; AC ids verbatim; real files; deps explicit; 4 Tasks.
