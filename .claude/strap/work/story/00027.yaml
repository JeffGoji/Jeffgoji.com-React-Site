  # Garage hub + 4 build blogs (data-driven BlogList collapse)

  ## Description
  Rebuild `/garage` into the V2 **5-car number-tag hub** with a **retired-car tribute** state (NC Ryoko, bloglink `/`), and re-skin the 4 near-identical blogs to the **car-identity banner + paginated build-log** (3/page, telemetry chips), collapsing them to one data-driven `<BlogList>`. Owns the shared `<CarCard>`.

  ## Linked Feature
  **Feature:** 00004
  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P3 — Per-surface redesign
  ## Acceptance Criteria subset
  AC-001 (garage + 4 blogs render V2), AC-005 (responsive), **AC-016** (all 4 blogs intact/reachable; render path stays react-markdown+remark-gfm, NO dangerouslySetInnerHTML/rehype-raw — primary home of the P8 markdown-safety assertion).
  ## Implementation notes
  Real files: `Garage/index.jsx`+`Cards.jsx` (number-tag grid; REMOVE the Fireball id-6 mismatch), `Garage/Cars.json` (add net-new `img`/`label`/`tag`; KEEP real Router `bloglink` paths, NC retired = `/`), `blog/{Miyoshi,Kiryu,Kasumi,Panda}/index.jsx` (collapse to `<BlogList data title banner/>`), `src/assets/Data/*Blog.json`. Mockup garage.html + blog.html; `app.js mountBlog` (3/page, sort `b.id-a.id`). Preserve the existing custom p/img/a react-markdown renderers. Clean up the `ndBlogList` var misname in Miyoshi.
  ## Dependencies
  Feature A. Blog `picture` webp repoint ← Feature C (AC-010). JSON `id` stays unique numeric (load-bearing). `CarCard` consumed by Story 00026.
