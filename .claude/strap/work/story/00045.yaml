  # Client-side responsive image delivery (ResponsiveImage + srcset/lazy) + OG swap (Phase 3)

  ## Description
  Apply responsive webp `srcset`/`sizes` + below-fold `loading="lazy"` across every image-bearing surface, consuming the webp renditions Story 00044's pipeline emits; swap the multi-MB OG/Twitter/JSON-LD social image in `index.html` for the optimized ~1200x630 (<200KB) rendition (all other meta unchanged). Introduces a shared `<ResponsiveImage>` primitive so no surface hand-rolls srcset.

  ## Linked Feature
  **Feature:** 00005
  ## Linked Spec section
  **Spec:** 00002  **Constituent Part:** P4 — Image-loading performance overhaul (client-ui half)
  ## Acceptance Criteria subset
  AC-010 (client application), AC-011 (OG image swap).
  ## Implementation notes
  Real files: new `src/components/common/ResponsiveImage.jsx`; image surfaces — `blog/*/index.jsx` (header Image; markdown imgs already lazy), `Garage/Cards.jsx` (static-imported car JPGs), `Articles/2025/GoodbyeC8.jsx` (7 static multi-MB JPGs), the consolidated gallery + the Feature-B rotating hero (LCP → `loading="eager"`), `index.html:34,49,72` (OG image only). Fix generic `alt="this post's pic"` opportunistically.
  ## Dependencies
  **Predecessor: Story 00044** (needs the webp renditions/manifests). Also needs Feature B's redesigned surfaces to attach srcset to (blogs, Garage, gallery hub, hero). C1a perf baseline captured first.
  ## Quality Checklist
  - [x] Concrete; Feature+Spec populated; AC ids verbatim; real files; deps explicit; 4 Tasks.
