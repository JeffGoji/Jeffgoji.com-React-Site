<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/goji.svg" />

        <!-- Responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="google-adsense-account" content="ca-pub-8417979887134577" />

        <!-- Primary SEO -->
        <link rel="canonical" href="https://jeffgoji.com/" />
        <meta
            name="description"
            content="Jeff Goji’s Car Blogs: daily driving stories, tuning guides, Miata modifications, autocross recaps, and performance tips."
        />
        <meta
            name="keywords"
            content="Jeff Goji, car blog, Miata, automotive tuning, autocross, performance driving, car modifications, The Goji Line"
        />
        <meta name="author" content="Jeff ‘Goji’ Anderson-Lester" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="JeffGoji.com" />
        <meta
            property="og:description"
            content="Dive into Jeff Goji's world of cars: Miata builds, tuning tips, and autocross event recaps."
        />
        <meta property="og:url" content="https://jeffgoji.com/" />
        <meta
            property="og:image"
            content="https://jeffgoji.com/og/og-cover-1200x630.jpg"
        />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="JeffGoji.com - Jeff Goji's Car Blogs"
        />
        <meta
            name="twitter:description"
            content="Car enthusiast blog by Jeff Goji: Miata mods, tuning guides, autocross stories, and performance upgrades."
        />
        <meta
            name="twitter:image"
            content="https://jeffgoji.com/og/og-cover-1200x630.jpg"
        />

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Blog",
                "name": "JeffGoji.com",
                "url": "https://jeffgoji.com/",
                "author": {
                    "@type": "Person",
                    "name": "Jeffrey 'Goji' Anderson-Lester"
                },
                "description": "Jeff Goji’s Car Blogs: daily driving stories, tuning guides, Miata modifications, autocross recaps, and performance tips.",
                "publisher": {
                    "@type": "Organization",
                    "name": "JeffGoji.com",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://jeffgoji.com/goji.svg"
                    }
                },
                "image": "https://jeffgoji.com/og/og-cover-1200x630.jpg"
            }
        </script>

        <!-- GLOBAL ADSENSE SCRIPT: -->
        <script
            async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
        ></script>

        <!--
            COOKIELESS ANALYTICS (PLAUSIBLE): no cookies, no localStorage.
            The `manual` build is deliberate: the default build patches history.pushState
            and fires its own pageview on every SPA navigation, which would double-count
            against src/hooks/usePageviews.js. Manual makes src/lib/analytics.js the only
            reporter. This script is deferred in <head>, so it executes before the
            /src/main.jsx module and window.plausible is callable by first mount.
        -->
        <script
            defer
            data-domain="jeffgoji.com"
            src="https://plausible.io/js/script.manual.js"
        ></script>

        <title>JeffGoji.com - Jeff Goji's Car Blogs</title>
    </head>

    <body>
        <!-- invisibly list all your pages -->
        <nav style="display:none">
          <a href="/">Home</a>
          <a href="/garage">Garage</a>
          <a href="/intro">Intro</a>
          <!-- …and so on for every route -->
        </nav>
      
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
